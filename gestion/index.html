<script>
/* ================================================================

   Si se dejan vacíos, la app funciona en MODO PRUEBA: los datos solo se
   guardan en este navegador.
   ================================================================ */
const SUPABASE_URL = "https://yyuqwkgwxrgtsbeuiitg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_cKK1IFhMvBA3ss5oqqSUeg_tHe_SRAh";

/* ---------------- datos fijos ---------------- */
const TALLERES=[["Pf","Perfume","p"],["Br","Bruma","p"],["Am","Ambientador de coche","p"],["Mk","Mikado","p"],["Ac","Aceite corporal","p"],["Cr","Crema","c"],["Bl","Blush","c"],["Ex","Exfoliante","c"],["Lb","Labial","c"],["Bc","Bálsamo con color","c"]];
const TNAME=Object.fromEntries(TALLERES.map(t=>[t[0],t[1]]));
const ESTADOS=[["lead","Nuevo contacto"],["presupuesto","Presupuesto enviado"],["confirmado","Confirmado"],["realizado","Realizado"],["perdido","Perdido / cancelado"]];

const OCASIONES=["Teambuilding","Cena de Navidad","Jornada de equipo o convención","Evento para clientes o de marca","Formación en marketing olfativo","Despedida de soltera / soltero","Despedida spa","Cumpleaños de adultos","Cumpleaños de adolescentes","Fiesta spa de cumpleaños","Grupos de amigos","Agencia, hotel o restaurante","Otro"];

const ORIGENES=["Formulario web","WhatsApp","Instagram","Email","Recomendación","Agencia","Google","Otro"];
const CAT_GASTO=["Materiales","Envases y packaging","Espacio / alquiler","Transporte","Publicidad","Web y herramientas","Gestoría e impuestos","Otros"];
const CAT_MAT=["Bases","Aceites esenciales y aromas","Envases","Etiquetas","Packaging","Material de trabajo","Otros"];

const DEF_AJUSTES={
  empresa:{nombre:"Lannex Lab",titular:"Cristina del Pilar Portillo Macho",nif:"",direccion:"",email:"lannexlab@gmail.com",telefono:"616 09 45 87",web:"lannexlab.com",iban:""},
  iva:21, validez:15, equipo:["Alex","Anna","Laura"], meta:0,
  tarifas:Object.fromEntries(TALLERES.map(t=>[t[0],{empresa:60,particular:60,coste:0}])),
  extras:[
    {nombre:"Caja regalo",modo:"persona",precio:0},
    {nombre:"Etiquetas personalizadas / con logo",modo:"persona",precio:0},
    {nombre:"Envase o soporte premium",modo:"persona",precio:0},
    {nombre:"Fragancia del equipo / del protagonista",modo:"fijo",precio:0},
    {nombre:"Segundo taller",modo:"persona",precio:0},
    {nombre:"Decoración de la mesa",modo:"fijo",precio:0},
    {nombre:"Desplazamiento",modo:"fijo",precio:0}],
  notaPresupuesto:"Presupuesto sin compromiso. Para reservar la fecha os pedimos confirmación por escrito.\nIncluye materias primas, material de trabajo, envases estándar, guía del equipo y montaje y recogida.",
  notaFactura:"Gracias por confiar en Lannex Lab.",
  plantillas:[
    {nombre:"Primera respuesta",texto:"¡Hola {nombre}! Somos Lannex Lab, gracias por escribirnos 😊 Para prepararos una propuesta, ¿nos decís fecha aproximada, número de personas, dónde os gustaría hacerlo y qué taller os apetece?"},
    {nombre:"Envío de presupuesto",texto:"Hola {nombre}, os enviamos el presupuesto para el taller de {taller} del {fecha} para {personas} personas: {total}. Cualquier duda nos decís. ¡Un abrazo!"},
    {nombre:"Seguimiento presupuesto",texto:"Hola {nombre}, ¿pudisteis ver el presupuesto del taller de {taller}? Si queréis ajustar algo (personas, extras o duración) lo adaptamos sin problema."},
    {nombre:"Confirmación de reserva",texto:"¡Hecho, {nombre}! Taller de {taller} confirmado el {fecha} a las {hora} en {lugar}, para {personas} personas. Llegaremos 30 minutos antes para montar. Si alguien tiene alergias o piel sensible, avisadnos."},
    {nombre:"Recordatorio día antes",texto:"¡Hola {nombre}! Mañana nos vemos a las {hora} en {lugar} para el taller de {taller}. Necesitamos mesas, sillas y un sitio ventilado. ¡Qué ganas!"},

};

/* ---------------- almacenamiento ---------------- */
const DEMO=!SUPABASE_URL||!SUPABASE_ANON_KEY;
const sb=(!DEMO&&window.supabase)?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:"lannex-gestion-auth"}}):null;
const KINDS=["cliente","taller","doc","gasto","material","proveedor","tarea","ajustes"];
const D={};KINDS.forEach(k=>D[k]=[]);
let AJ=structuredClone(DEF_AJUSTES);let USER="";
const LS="lannex_gestion_v1";
function lsGet(){try{return JSON.parse(localStorage.getItem(LS)||"[]")}catch(e){return[]}}
function lsSet(a){try{localStorage.setItem(LS,JSON.stringify(a))}catch(e){toast("No se pudo guardar en este navegador")}}
async function loadAll(){
  let rows=[];
  if(DEMO){rows=lsGet()}
  else{
    let from=0;for(;;){const {data,error}=await sb.from("lannex_items").select("id,kind,data").range(from,from+999);if(error){dbErr("cargar",error);break}rows=rows.concat(data);if(data.length<1000)break;from+=1000}
  }
  KINDS.forEach(k=>D[k]=[]);
  rows.forEach(r=>{if(D[r.kind])D[r.kind].push({...r.data,id:r.id})});
  const a=D.ajustes[0];AJ=a?deepMerge(structuredClone(DEF_AJUSTES),a):structuredClone(DEF_AJUSTES);
}
function deepMerge(base,o){for(const k in o){if(o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k])&&base[k]&&typeof base[k]==="object")deepMerge(base[k],o[k]);else base[k]=o[k]}return base}
function uid(){return (crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))}
function dbErr(acc,error){const m=(error&&error.message)||String(error);let t;
  if(/row-level security|permission denied|42501/i.test(m+" "+(error.code||"")))t=`No se ha podido ${acc}: tu email (${USER}) no está en la lista del equipo de Lannex. Hay que añadirlo en Supabase.`;
  else if(/relation .* does not exist|42P01|Could not find the table/i.test(m))t=`No se ha podido ${acc}: falta crear la tabla en Supabase (el texto del SQL Editor no se ejecutó bien).`;
  else if(/JWT|apikey|API key|401/i.test(m))t=`No se ha podido ${acc}: la sesión ha caducado o la clave no es correcta. Cierra sesión y vuelve a entrar.`;
  else t=`No se ha podido ${acc}: ${m}`;
  alert(t)}
async function save(kind,obj){
  if(!obj.id)obj.id=uid();obj._upd=new Date().toISOString();obj._by=USER;

/* ---------------- cálculos ---------------- */
function calc(t){
  const personas=num(t.personas);const base=personas*num(t.precioPersona);
  const lineas=[{concepto:`Taller de ${tallerName(t)} (${personas} personas × ${eur(t.precioPersona)})`,cant:personas,precio:num(t.precioPersona),importe:base}];
  (t.extras||[]).forEach(x=>{if(!x.nombre)return;const cant=x.modo==="persona"?personas:num(x.cant||1);const imp=cant*num(x.precio);lineas.push({concepto:x.nombre+(x.modo==="persona"?` (${cant} × ${eur(x.precio)})`:""),cant,precio:num(x.precio),importe:imp})});
  const bruto=lineas.reduce((a,l)=>a+l.importe,0);const dto=num(t.descuento);const base_imp=Math.max(0,bruto-dto);
  const ivaP=t.iva===""||t.iva==null?num(AJ.iva):num(t.iva);const iva=base_imp*ivaP/100;const total=base_imp+iva;
  const cobrado=(t.pagos||[]).reduce((a,p)=>a+num(p.importe),0);
  const coste=personas*(t.talleres||[]).reduce((a,c)=>a+num(AJ.tarifas[c]?.coste),0);
  const gastos=D.gasto.filter(g=>g.tallerId===t.id).reduce((a,g)=>a+num(g.importe),0);
  return {lineas,bruto,dto,base:base_imp,ivaP,iva,total,cobrado,pendiente:Math.max(0,total-cobrado),coste,gastos,margen:base_imp-coste-gastos};
}
function payTag(t){if(t.estado==="perdido"||t.estado==="lead")return"";const c=calc(t);if(c.total<=0)return"";if(c.pendiente<=0.009)return`<span class="tag t-ok">Cobrado</span>`;if(c.cobrado>0)return`<span class="tag t-pend">Pendiente ${eur(c.pendiente)}</span>`;return t.estado==="realizado"?`<span class="tag t-pend">Sin cobrar</span>`:""}
function stTag(e){return `<span class="tag t-${e}">${ENAME[e]||e}</span>`}

async function setEstado(id,e){const t=D.taller.find(x=>x.id===id);t.estado=e;if(e==="presupuesto"&&!t.presuFecha)t.presuFecha=today();await save("taller",t);toast("Estado: "+ENAME[e]);renderNav();render();openTaller(id)}
async function toggleChk(id,k,v){const t=D.taller.find(x=>x.id===id);t[k]=v;await save("taller",t)}
async function addPago(e,id){e.preventDefault();const f=readForm(e.target);const t=D.taller.find(x=>x.id===id);(t.pagos=t.pagos||[]).push(f);await save("taller",t);toast("Cobro añadido");render();openTaller(id)}

async function dupTaller(id){const t=structuredClone(D.taller.find(x=>x.id===id));delete t.id;t.estado="lead";t.fecha="";t.pagos=[];["chkMaterial","chkConfirmacion","chkRecordatorio","chkResena","chkFotos","presuFecha"].forEach(k=>delete t[k]);await save("taller",t);toast("Duplicado");editTaller(t.id)}

  openDr("Enviar mensaje",`<p class="empty">Elige una plantilla, revisa el texto y envía.</p><div class="list">${AJ.plantillas.map((p,i)=>`<div class="it" onclick="msgEdit('${id}','${how}',${i})"><div class="m"><b>${esc(p.nombre)}</b><span>${esc(fillTpl(p.texto,t)).slice(0,110)}…</span></div></div>`).join("")}<div class="it" onclick="msgEdit('${id}','${how}',-1)"><div class="m"><b>Mensaje libre</b></div></div></div><p><button class="btn o s" onclick="openTaller('${id}')">← Volver</button></p>`)}

function nextNum(tipo){const y=today().slice(0,4);const p=(tipo==="factura"?"F":"P")+"-"+y+"-";const n=D.doc.filter(d=>d.tipo===tipo&&d.numero?.startsWith(p)).map(d=>parseInt(d.numero.slice(p.length))||0);return p+String((n.length?Math.max(...n):0)+1).padStart(3,"0")}
async function makeDoc(id,tipo){const t=D.taller.find(x=>x.id===id);const c=cliente(t.clienteId)||{};const k=calc(t);
  if(!t.clienteId){toast("El taller no tiene cliente");return}
  if(tipo==="factura"&&(!c.nif&&c.tipo!=="particular")&&!confirm("Este cliente no tiene NIF/CIF. ¿Crear la factura igualmente?"))return;
  const d={tipo,numero:nextNum(tipo),fecha:today(),tallerId:id,clienteId:t.clienteId,cliente:{nombre:c.razon||c.nombre,nif:c.nif||"",direccion:c.direccion||"",email:c.email||"",telefono:c.telefono||""},
    detalle:`${tallerName(t)}${t.fecha?" · "+fd(t.fecha,{day:"numeric",month:"long",year:"numeric"}):""}${t.lugar?" · "+t.lugar:""}`,lineas:k.lineas,descuento:k.dto,base:k.base,ivaP:k.ivaP,iva:k.iva,total:k.total,nota:tipo==="factura"?AJ.notaFactura:AJ.notaPresupuesto,emisor:structuredClone(AJ.empresa),validez:AJ.validez};
  await save("doc",d);
  if(tipo==="presupuesto"&&["lead"].includes(t.estado)){t.estado="presupuesto";t.presuFecha=today();await save("taller",t)}
  toast((tipo==="factura"?"Factura ":"Presupuesto ")+d.numero+" creado");renderNav();render();printDoc(d.id)}

function printDoc(id){const d=D.doc.find(x=>x.id===id);if(!d)return;
  openDr(`${d.tipo==="factura"?"Factura":"Presupuesto"} ${esc(d.numero)}`,`<div class="row" style="margin-bottom:14px"><button class="btn" onclick="doPrint('${id}')">Imprimir / guardar PDF</button>${d.tallerId?`<button class="btn o" onclick="openTaller('${d.tallerId}')">Ver taller</button>`:""}<button class="btn o" style="color:var(--red);border-color:var(--red)" onclick="delDoc('${id}')">Eliminar</button></div><div class="card" style="background:#fff">${docHTML(d)}</div>`)}
function doPrint(id){const d=D.doc.find(x=>x.id===id);$("#print").innerHTML=docHTML(d);const old=document.title;document.title=`${d.numero} ${d.cliente.nombre}`;document.body.classList.add("printing");setTimeout(()=>{window.print();document.body.classList.remove("printing");document.title=old},50)}
async function delDoc(id){const d=D.doc.find(x=>x.id===id);if(d.tipo==="factura"&&!confirm("Ojo: borrar facturas puede dejar huecos en la numeración. ¿Seguro?"))return;if(d.tipo!=="factura"&&!confirm("¿Eliminar el presupuesto?"))return;await del("doc",id);closeDr();render()}

/* ---------------- CALENDARIO ---------------- */
let CM=today().slice(0,7);
function vCal(){const [y,m]=CM.split("-").map(Number);const first=new Date(y,m-1,1);const start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
  const days=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);days.push(d)}
  const ds=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const col={lead:"var(--blue2)",presupuesto:"var(--amber2)",confirmado:"var(--sage2)",realizado:"#1B1A21",perdido:"var(--red2)"};
  return ph(first.toLocaleDateString("es-ES",{month:"long",year:"numeric"}).replace(/^./,c=>c.toUpperCase()),"Talleres y seguimientos del mes.",`<button class="btn o" onclick="shiftM(-1)">←</button><button class="btn o" onclick="CM=today().slice(0,7);render()">Hoy</button><button class="btn o" onclick="shiftM(1)">→</button>`)+
  `<div class="cal">${["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].map(d=>`<div class="dh">${d}</div>`).join("")}${days.map(d=>{const s=ds(d);
   const ev=D.taller.filter(t=>t.fecha===s&&t.estado!=="perdido").map(t=>`<span class="ev" style="background:${col[t.estado]};${t.estado==="realizado"?"color:#fff":""}" onclick="openTaller('${t.id}')">${esc(t.hora||"")} ${esc(cliente(t.clienteId)?.nombre||"")}</span>`).join("")+D.tarea.filter(x=>x.fecha===s&&!x.hecho).map(x=>`<span class="ev" style="border:1px dashed var(--line)" onclick="editTarea('${x.id}')">✓ ${esc(x.titulo)}</span>`).join("");
   return `<div class="d ${d.getMonth()!==m-1?"out":""} ${s===today()?"today":""}"><span class="n">${d.getDate()}</span>${ev}</div>`}).join("")}</div>`}
function shiftM(n){const [y,m]=CM.split("-").map(Number);const d=new Date(y,m-1+n,1);CM=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");render()}

let FP={tipo:"mes",v:today().slice(0,7)};
function inPeriod(d){if(!d)return false;if(FP.tipo==="mes")return d.startsWith(FP.v);if(FP.tipo==="año")return d.startsWith(FP.v.slice(0,4));if(FP.tipo==="trim"){const [y,m]=FP.v.split("-").map(Number);const q=Math.floor((m-1)/3);const dm=Number(d.slice(5,7));return d.startsWith(y+"-")&&Math.floor((dm-1)/3)===q}return true}
function vFin(){
  const ts=D.taller.filter(t=>["confirmado","realizado"].includes(t.estado)&&inPeriod(t.fecha));
  const ing=ts.reduce((a,t)=>a+calc(t).base,0);const ivaR=ts.reduce((a,t)=>a+calc(t).iva,0);const coste=ts.reduce((a,t)=>a+calc(t).coste,0);
  const gs=D.gasto.filter(g=>inPeriod(g.fecha)).sort((a,b)=>b.fecha.localeCompare(a.fecha));const gas=gs.reduce((a,g)=>a+num(g.importe),0);
  const cob=D.taller.flatMap(t=>(t.pagos||[]).map(p=>({...p,t}))).filter(p=>inPeriod(p.fecha));const cobT=cob.reduce((a,p)=>a+num(p.importe),0);
  const porCat={};gs.forEach(g=>porCat[g.categoria||"Otros"]=(porCat[g.categoria||"Otros"]||0)+num(g.importe));
  const adel={};D.gasto.filter(g=>g.pagadoPor&&g.pagadoPor!=="Empresa"&&!g.reembolsado).forEach(g=>adel[g.pagadoPor]=(adel[g.pagadoPor]||0)+num(g.importe));
  const porTaller={};ts.forEach(t=>t.talleres?.forEach(c=>porTaller[c]=(porTaller[c]||0)+1));
  const porOrigen={};D.taller.filter(t=>inPeriod(t.fecha)||inPeriod(t._upd?.slice(0,10))).forEach(t=>{const o=t.origen||cliente(t.clienteId)?.origen||"Sin indicar";porOrigen[o]=porOrigen[o]||{n:0,ok:0};porOrigen[o].n++;if(["confirmado","realizado"].includes(t.estado))porOrigen[o].ok++});
  const sel=`<select class="in" style="width:auto" onchange="FP.tipo=this.value;render()">${opts([["mes","Mes"],["trim","Trimestre"],["año","Año"],["todo","Todo"]],FP.tipo)}</select>${FP.tipo!=="todo"?`<input class="in" style="width:auto" type="month" value="${FP.v}" onchange="FP.v=this.value;render()">`:""}`;
  return ph("Finanzas","Ingresos sin IVA por fecha del taller (confirmados y realizados).",sel+`<button class="btn o" onclick="exportCSV()">Exportar CSV</button><button class="btn" onclick="editGasto()">+ Gasto</button>`)+
  `<div class="grid g4"><div class="card kpi"><span class="lb">Ingresos</span><div class="v">${eur(ing)}</div><div class="s">${ts.length} talleres · IVA repercutido ${eur(ivaR)}</div></div>
   <div class="card kpi"><span class="lb">Gastos</span><div class="v">${eur(gas)}</div><div class="s">${gs.length} apuntes</div></div>
   <div class="card kpi"><span class="lb">Coste materiales estimado</span><div class="v">${eur(coste)}</div><div class="s">Según el coste por persona de Ajustes</div></div>
   <div class="card kpi"><span class="lb">Resultado</span><div class="v" style="color:${ing-gas>=0?"var(--sage)":"var(--red)"}">${eur(ing-gas)}</div><div class="s">Ingresos − gastos · Cobrado en el periodo ${eur(cobT)}</div></div></div>
  <div class="grid g3" style="margin-top:14px">
   <div class="card"><h2>Gastos por categoría</h2>${Object.entries(porCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin:8px 0"><div class="row" style="justify-content:space-between"><span>${esc(k)}</span><b>${eur(v)}</b></div><div class="bar"><i style="width:${gas?v/gas*100:0}%"></i></div></div>`).join("")||`<p class="empty">Sin gastos.</p>`}</div>
   <div class="card"><h2>Talleres más vendidos</h2>${Object.entries(porTaller).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row" style="justify-content:space-between;margin:6px 0"><span>${esc(TNAME[k])}</span><b>${v}</b></div>`).join("")||`<p class="empty">—</p>`}
    <h2 style="margin-top:16px">De dónde vienen</h2>${Object.entries(porOrigen).sort((a,b)=>b[1].n-a[1].n).map(([k,v])=>`<div class="row" style="justify-content:space-between;margin:6px 0"><span>${esc(k)}</span><span>${v.n} contactos · <b>${v.ok} cerrados</b></span></div>`).join("")||`<p class="empty">—</p>`}</div>
   <div class="card"><h2>Gastos adelantados</h2><p class="empty" style="margin-top:-4px">Lo que alguien ha pagado de su bolsillo y falta devolver.</p>${Object.entries(adel).map(([k,v])=>`<div class="row" style="justify-content:space-between;margin:6px 0"><span>${esc(k)}</span><b>${eur(v)}</b></div>`).join("")||`<p class="empty">Nada pendiente.</p>`}</div>
  </div>
  <div class="card tw" style="margin-top:14px"><h2>Gastos</h2><table><thead><tr><th>Fecha</th><th>Concepto</th><th class="hide-m">Categoría</th><th class="hide-m">Pagado por</th><th class="num">Importe</th></tr></thead><tbody>${gs.map(g=>`<tr class="cl" onclick="editGasto('${g.id}')"><td>${fd(g.fecha,{day:"numeric",month:"short"})}</td><td>${esc(g.concepto)}${g.tallerId?` <small class="lb">· taller</small>`:""}</td><td class="hide-m">${esc(g.categoria||"")}</td><td class="hide-m">${esc(g.pagadoPor||"")}${g.reembolsado?" ✓":""}</td><td class="num">${eur(g.importe)}</td></tr>`).join("")||`<tr><td colspan="5" class="empty">Sin gastos en este periodo.</td></tr>`}</tbody></table></div>`}

function exportCSV(){const rows=[["Tipo","Fecha","Concepto","Cliente/Proveedor","Base","IVA","Total"]];
  D.taller.filter(t=>["confirmado","realizado"].includes(t.estado)&&inPeriod(t.fecha)).forEach(t=>{const c=calc(t);rows.push(["Ingreso",t.fecha,tallerName(t),cliente(t.clienteId)?.nombre||"",c.base.toFixed(2),c.iva.toFixed(2),c.total.toFixed(2)])});
  D.gasto.filter(g=>inPeriod(g.fecha)).forEach(g=>rows.push(["Gasto",g.fecha,g.concepto,D.proveedor.find(p=>p.id===g.proveedorId)?.nombre||"","","",num(g.importe).toFixed(2)]));
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"}));a.download=`lannex-finanzas-${FP.tipo==="todo"?"todo":FP.v}.csv`;a.click()}

  openDr(id?"Editar proveedor":"Nuevo proveedor",`<form class="f" id="pf" onsubmit="saveProv(event,'${id||""}')"><div class="two"><label class="fl">Nombre<input name="nombre" required value="${esc(p.nombre)}"></label><label class="fl">Qué les compramos<input name="categoria" value="${esc(p.categoria)}" placeholder="Bases de perfume"></label></div>

   <label class="fl">Web<input name="web" value="${esc(p.web)}"></label><label class="fl">Notas (pedido mínimo, plazos, descuentos…)<textarea name="notas">${esc(p.notas)}</textarea></label>
   <div class="row" style="justify-content:space-between"><button class="btn">Guardar</button>${id?`<button type="button" class="btn o" style="color:var(--red);border-color:var(--red)" onclick="delProv('${id}')">Eliminar</button>`:""}</div></form>`)}
async function saveProv(e,id){e.preventDefault();const f=readForm($("#pf"));const p=id?{...D.proveedor.find(x=>x.id===id),...f}:f;await save("proveedor",p);closeDr();render()}
async function delProv(id){if(!confirm("¿Eliminar?"))return;await del("proveedor",id);closeDr();render()}

/* ---------------- MENSAJES (plantillas) ---------------- */
function vPlant(){return ph("Mensajes","Plantillas de WhatsApp y email. Se rellenan solas desde cada taller.",`<button class="btn" onclick="editPlant(-1)">+ Plantilla</button>`)+
  `<p class="empty">Huecos disponibles: {nombre} {taller} {fecha} {hora} {lugar} {personas} {total}</p><div class="grid g2">${AJ.plantillas.map((p,i)=>`<div class="card" style="cursor:pointer" onclick="editPlant(${i})"><h2>${esc(p.nombre)}</h2><p style="white-space:pre-wrap;color:var(--muted);margin:0">${esc(p.texto)}</p></div>`).join("")}</div>`}
function editPlant(i){const p=i>=0?AJ.plantillas[i]:{nombre:"",texto:""};
  openDr(i>=0?"Editar plantilla":"Nueva plantilla",`<form class="f" onsubmit="savePlant(event,${i})"><label class="fl">Nombre<input name="nombre" required value="${esc(p.nombre)}"></label><label class="fl">Texto<textarea name="texto" style="min-height:180px" required>${esc(p.texto)}</textarea></label><div class="row" style="justify-content:space-between"><button class="btn">Guardar</button>${i>=0?`<button type="button" class="btn o" style="color:var(--red);border-color:var(--red)" onclick="delPlant(${i})">Eliminar</button>`:""}</div></form>`)}
async function savePlant(e,i){e.preventDefault();const f=readForm(e.target);const a=structuredClone(AJ);if(i>=0)a.plantillas[i]=f;else a.plantillas.push(f);await saveAj(a);closeDr();render()}
async function delPlant(i){if(!confirm("¿Eliminar plantilla?"))return;const a=structuredClone(AJ);a.plantillas.splice(i,1);await saveAj(a);closeDr();render()}
async function saveAj(a){const cur=D.ajustes[0];a.id=cur?.id;await save("ajustes",a);toast("Ajustes guardados")}

/* ---------------- CALCULADORA ---------------- */
let CALC=null;
function calcInit(){
  try{CALC=JSON.parse(localStorage.getItem("lannex_calc")||"null")}catch(e){}
  if(!CALC)CALC={tarifa:"empresa",personas:15,talleres:["Pf"],precio:"",coste:"",extras:AJ.extras.map(x=>({...x,on:false,coste:0,cant:1})),desplazamiento:0,espacio:0,equipo:0,otros:0,dto:0,iva:AJ.iva,objetivo:50,reparto:2,auto:true};
}
function calcSave(){try{localStorage.setItem("lannex_calc",JSON.stringify(CALC))}catch(e){}}
function calcBase(){const p=CALC.talleres.reduce((a,c)=>a+num(AJ.tarifas[c]?.[CALC.tarifa]),0);const k=CALC.talleres.reduce((a,c)=>a+num(AJ.tarifas[c]?.coste),0);return {p,k}}
function calcRes(){const n=num(CALC.personas);const pp=num(CALC.precio);const base=n*pp;
  const ex=CALC.extras.filter(x=>x.on&&x.nombre).map(x=>{const c=x.modo==="persona"?n:num(x.cant||1);return {...x,c,venta:c*num(x.precio),gasto:c*num(x.coste)}});
  const exV=ex.reduce((a,x)=>a+x.venta,0),exC=ex.reduce((a,x)=>a+x.gasto,0);
  const bruto=base+exV;const dto=bruto*num(CALC.dto)/100;const neto=bruto-dto;const iva=neto*num(CALC.iva)/100;
  const mat=n*num(CALC.coste);const fijos=num(CALC.desplazamiento)+num(CALC.espacio)+num(CALC.equipo)+num(CALC.otros);
  const costes=mat+exC+fijos;const ben=neto-costes;
  // precio por persona para llegar al margen objetivo (sobre la base sin IVA)
  const obj=num(CALC.objetivo)/100;let sug=0;if(n>0&&obj<1){const need=costes/(1-obj);sug=Math.max(0,(need/(1-num(CALC.dto)/100)-exV)/n)}
  return {n,pp,base,ex,exV,exC,bruto,dto,neto,iva,total:neto+iva,mat,fijos,costes,ben,margen:neto?ben/neto*100:0,sug}}
function vCalc(){if(!CALC)calcInit();const b=calcBase();if(CALC.auto){CALC.precio=b.p;CALC.coste=b.k}
  return ph("Calculadora","Calcula el precio de un taller con sus extras y mira cuánto ganáis.",`<button class="btn o" onclick="calcReset()">Empezar de cero</button>`)+
  `<div class="grid" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start" id="calcgrid">
  <div class="grid">
   <div class="card f"><h2>El taller</h2>
    <div class="chips">${[["empresa","Empresa"],["particular","Particular"]].map(([v,l])=>`<button type="button" class="chip ${CALC.tarifa===v?"on":""}" onclick="CALC.tarifa='${v}';CALC.auto=true;cR()">${l}</button>`).join("")}</div>
    <div class="tl">${TALLERES.map(([c,n,k])=>`<label class="${k==="c"?"c":""}"><input type="checkbox" ${CALC.talleres.includes(c)?"checked":""} onchange="calcTog('${c}',this.checked)"><b>${c}</b>${n}</label>`).join("")}</div>
    <div class="three"><label class="fl">Personas<input inputmode="numeric" value="${esc(CALC.personas)}" oninput="CALC.personas=this.value;cU()"></label>
     <label class="fl">Precio por persona (€)<input id="c-pp" inputmode="decimal" value="${esc(CALC.precio)}" oninput="CALC.precio=this.value;CALC.auto=false;cU()"></label>
     <label class="fl">Coste material / persona (€)<input id="c-k" inputmode="decimal" value="${esc(CALC.coste)}" oninput="CALC.coste=this.value;CALC.auto=false;cU()"></label></div>
    <p class="lb" style="margin:0">${CALC.auto?"Precios cogidos de Ajustes":"Precios cambiados a mano · "}${CALC.auto?"":`<a href="#" onclick="CALC.auto=true;cR();return false">volver a los de Ajustes</a>`}</p>
   </div>
   <div class="card f"><h2>Extras de personalización</h2><p class="empty" style="margin:-6px 0 0">Marca los que lleva. «Cobras» es lo que paga el cliente y «Te cuesta» lo que os cuesta a vosotros.</p>
    <div class="lines"><div class="ln lb cx"><span></span><span></span><span></span><span>Cant.</span><span>Cobras €</span><span>Cuesta €</span><span></span></div>${CALC.extras.map((x,i)=>`<div class="ln cx"><input type="checkbox" ${x.on?"checked":""} onchange="CALC.extras[${i}].on=this.checked;cU()" style="width:18px;height:18px"><input value="${esc(x.nombre)}" placeholder="Extra" oninput="CALC.extras[${i}].nombre=this.value;cU()"><select onchange="CALC.extras[${i}].modo=this.value;cR()">${opts([["persona","Por persona"],["fijo","Fijo"]],x.modo)}</select><input ${x.modo==="persona"?"disabled placeholder='×pers'":""} value="${x.modo==="persona"?"":esc(x.cant??1)}" inputmode="decimal" title="Cantidad" oninput="CALC.extras[${i}].cant=this.value;cU()"><input value="${esc(x.precio)}" inputmode="decimal" title="Cobras €" placeholder="Cobras" oninput="CALC.extras[${i}].precio=this.value;cU()"><input value="${esc(x.coste)}" inputmode="decimal" title="Te cuesta €" placeholder="Cuesta" oninput="CALC.extras[${i}].coste=this.value;cU()"><button type="button" class="del" onclick="CALC.extras.splice(${i},1);cR()">×</button></div>`).join("")}</div>
    <button type="button" class="btn s o" onclick="CALC.extras.push({nombre:'',modo:'persona',precio:0,coste:0,cant:1,on:true});cR()">+ Otro extra</button>
   </div>
   <div class="card f"><h2>Otros costes del día</h2>
    <div class="two"><label class="fl">Desplazamiento (€)<input inputmode="decimal" value="${esc(CALC.desplazamiento)}" oninput="CALC.desplazamiento=this.value;cU()"></label><label class="fl">Alquiler de espacio (€)<input inputmode="decimal" value="${esc(CALC.espacio)}" oninput="CALC.espacio=this.value;cU()"></label></div>
    <div class="two"><label class="fl">Pago a colaboradores (€)<input inputmode="decimal" value="${esc(CALC.equipo)}" oninput="CALC.equipo=this.value;cU()"></label><label class="fl">Otros (€)<input inputmode="decimal" value="${esc(CALC.otros)}" oninput="CALC.otros=this.value;cU()"></label></div>
    <div class="three"><label class="fl">Descuento (%)<input inputmode="decimal" value="${esc(CALC.dto)}" oninput="CALC.dto=this.value;cU()"></label><label class="fl">IVA (%)<input inputmode="decimal" value="${esc(CALC.iva)}" oninput="CALC.iva=this.value;cU()"></label><label class="fl">Margen que queréis (%)<input inputmode="decimal" value="${esc(CALC.objetivo)}" oninput="CALC.objetivo=this.value;cU()"></label></div>
    <div><span class="fl" style="display:block;margin-bottom:6px">El beneficio se reparte entre</span><div class="chips">${[2,3].map(n=>`<button type="button" class="chip ${num(CALC.reparto||2)===n?"on":""}" onclick="CALC.reparto=${n};cR()">${n} personas</button>`).join("")}</div></div>
   </div>
  </div>
  <div class="card" id="c-res" style="position:sticky;top:20px"></div></div>`}
function cU(){calcSave();const r=calcRes();const el=$("#c-res");if(!el)return;const row=(l,v,b)=>`<div class="row" style="justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)"><span>${l}</span>${b?`<b>${v}</b>`:`<span>${v}</span>`}</div>`;
  el.innerHTML=`<span class="lb">Precio para el cliente</span><div style="font:500 2.6rem var(--serif);margin:4px 0">${eur(r.total)}</div><div class="s" style="color:var(--muted);margin-bottom:12px">IVA incluido · ${r.n?eur(r.total/r.n):"—"} por persona</div>
   ${row(`Taller (${r.n} × ${eur(r.pp)})`,eur(r.base))}${r.ex.map(x=>row(esc(x.nombre)+(x.modo==="persona"?` (${x.c} × ${eur(x.precio)})`:""),eur(x.venta))).join("")}${r.dto?row(`Descuento ${num(CALC.dto)}%`,"−"+eur(r.dto)):""}${row("Base sin IVA",eur(r.neto),1)}${row(`IVA ${num(CALC.iva)}%`,eur(r.iva))}
   <div class="lb" style="margin-top:18px">Lo que os cuesta</div>${row("Material del taller",eur(r.mat))}${r.exC?row("Material de los extras",eur(r.exC)):""}${r.fijos?row("Desplazamiento, espacio y otros",eur(r.fijos)):""}${row("Total costes",eur(r.costes),1)}
   <div style="margin-top:16px;padding:14px;border-radius:14px;background:${r.ben>=0?"var(--sage2)":"var(--red2)"}"><span class="lb">Beneficio</span><div style="font:500 2rem var(--serif)">${eur(r.ben)}</div><div style="font-size:.85rem">Margen ${Math.round(r.margen)}% · ${eur(r.ben/(num(CALC.reparto)||2))} para cada uno de los ${num(CALC.reparto)||2}</div></div>
   ${r.n?`<p style="font-size:.85rem;margin:12px 0 0">Para tener un <b>${num(CALC.objetivo)}% de margen</b>, el taller tendría que costar <b>${eur(r.sug)}</b> por persona. <a href="#" onclick="CALC.precio=${r.sug.toFixed(2)};CALC.auto=false;cR();return false">Usar este precio</a></p>`:""}
   <div class="row" style="margin-top:16px"><button class="btn" onclick="calcToTaller()">Crear taller con este precio</button><button class="btn o" onclick="calcCopy()">Copiar resumen</button></div>`}
function cR(){render();cU()}
function calcTog(c,on){CALC.talleres=on?[...new Set([...CALC.talleres,c])]:CALC.talleres.filter(x=>x!==c);CALC.auto=true;cR()}
function calcReset(){localStorage.removeItem("lannex_calc");CALC=null;cR()}
function calcCopy(){const r=calcRes();const t=CALC.talleres.map(c=>TNAME[c]).join(" + ");const txt=`Taller de ${t.toLowerCase()} para ${r.n} personas\n- Taller: ${r.n} × ${eur(r.pp)} = ${eur(r.base)}\n${r.ex.map(x=>`- ${x.nombre}: ${eur(x.venta)}`).join("\n")}${r.ex.length?"\n":""}${r.dto?`- Descuento: −${eur(r.dto)}\n`:""}Total: ${eur(r.neto)} + IVA (${eur(r.total)} IVA incluido)`;navigator.clipboard.writeText(txt).then(()=>toast("Resumen copiado"))}
function calcToTaller(){const r=calcRes();window._calcPreset={tarifa:CALC.tarifa,talleres:[...CALC.talleres],personas:String(CALC.personas),precioPersona:String(num(CALC.precio)),iva:String(num(CALC.iva)),descuento:r.dto?r.dto.toFixed(2):"",extras:r.ex.map(x=>({nombre:x.nombre,modo:x.modo,precio:num(x.precio),cant:x.cant}))};newTaller()}
/* ---------------- AJUSTES ---------------- */
function vAj(){const e=AJ.empresa;
  return ph("Ajustes","Precios, extras, datos de facturación y equipo.")+`<form class="f" id="af" onsubmit="saveAjustes(event)">
  <div class="card"><h2>Precios por persona</h2><p class="empty" style="margin-top:-6px">Se usan para calcular el presupuesto. Siempre podéis cambiar el precio en cada taller. El coste es lo que os cuesta el material por persona (para saber el margen).</p>
   <div class="tw"><table><thead><tr><th>Taller</th><th class="num">Empresa €</th><th class="num">Particular €</th><th class="num">Coste material €</th></tr></thead><tbody>${TALLERES.map(([c,n])=>`<tr><td><b>${c}</b> ${n}</td>${["empresa","particular","coste"].map(k=>`<td class="num"><input class="in" style="width:90px;text-align:right" data-t="${c}" data-k="${k}" inputmode="decimal" value="${esc(AJ.tarifas[c]?.[k]??"")}"></td>`).join("")}</tr>`).join("")}</tbody></table></div></div>
  <div class="card" style="margin-top:14px"><h2>Extras de la fórmula</h2><div class="lines" id="aj-ex">${AJ.extras.map((x,i)=>`<div class="ln" style="grid-template-columns:minmax(0,1fr) 130px 90px 30px"><input data-x="${i}" data-k="nombre" value="${esc(x.nombre)}"><select data-x="${i}" data-k="modo">${opts([["persona","Por persona"],["fijo","Precio fijo"]],x.modo)}</select><input data-x="${i}" data-k="precio" inputmode="decimal" value="${esc(x.precio)}"><button type="button" class="del" onclick="this.parentNode.remove()">×</button></div>`).join("")}</div><button type="button" class="btn s o" onclick="addAjEx()">+ Extra</button></div>
  <div class="card" style="margin-top:14px"><h2>Datos para presupuestos y facturas</h2><div class="f">
   <div class="two"><label class="fl">Nombre comercial<input name="e_nombre" value="${esc(e.nombre)}"></label><label class="fl">Titular (nombre fiscal)<input name="e_titular" value="${esc(e.titular)}"></label></div>
   <div class="two"><label class="fl">NIF<input name="e_nif" value="${esc(e.nif)}"></label><label class="fl">Dirección fiscal<input name="e_direccion" value="${esc(e.direccion)}"></label></div>
   <div class="three"><label class="fl">Email<input name="e_email" value="${esc(e.email)}"></label><label class="fl">Teléfono<input name="e_telefono" value="${esc(e.telefono)}"></label><label class="fl">Web<input name="e_web" value="${esc(e.web)}"></label></div>
   <label class="fl">IBAN (sale en las facturas)<input name="e_iban" value="${esc(e.iban)}"></label>
   <div class="three"><label class="fl">IVA por defecto (%)<input name="iva" inputmode="decimal" value="${esc(AJ.iva)}"></label><label class="fl">Validez presupuesto (días)<input name="validez" inputmode="numeric" value="${esc(AJ.validez)}"></label><label class="fl">Meta de facturación mensual (€)<input name="meta" inputmode="decimal" value="${esc(AJ.meta)}"></label></div>
   <label class="fl">Nota al pie del presupuesto<textarea name="notaPresupuesto">${esc(AJ.notaPresupuesto)}</textarea></label>
   <label class="fl">Nota al pie de la factura<textarea name="notaFactura">${esc(AJ.notaFactura)}</textarea></label>
   <label class="fl">Equipo (separado por comas)<input name="equipo" value="${esc(AJ.equipo.join(", "))}"></label></div></div>
  <div class="row" style="margin-top:14px"><button class="btn">Guardar ajustes</button></div></form>
  <div class="card" style="margin-top:14px"><h2>Copia de seguridad</h2><p class="empty" style="margin-top:-6px">Descarga todos los datos en un archivo o recupéralos desde uno.</p><div class="row"><button class="btn o" onclick="backup()">Descargar copia</button><label class="btn o">Restaurar copia<input type="file" accept=".json" hidden onchange="restore(this.files[0])"></label></div></div>`}
function addAjEx(){const i=Date.now();$("#aj-ex").insertAdjacentHTML("beforeend",`<div class="ln" style="grid-template-columns:minmax(0,1fr) 130px 90px 30px"><input data-x="${i}" data-k="nombre"><select data-x="${i}" data-k="modo">${opts([["persona","Por persona"],["fijo","Precio fijo"]],"fijo")}</select><input data-x="${i}" data-k="precio" inputmode="decimal" value="0"><button type="button" class="del" onclick="this.parentNode.remove()">×</button></div>`)}
async function saveAjustes(e){e.preventDefault();const f=$("#af");const a=structuredClone(AJ);
  f.querySelectorAll("[data-t]").forEach(i=>{a.tarifas[i.dataset.t]=a.tarifas[i.dataset.t]||{};a.tarifas[i.dataset.t][i.dataset.k]=num(i.value)});
  const ex={};f.querySelectorAll("[data-x]").forEach(i=>{(ex[i.dataset.x]=ex[i.dataset.x]||{})[i.dataset.k]=i.dataset.k==="precio"?num(i.value):i.value.trim()});a.extras=Object.values(ex).filter(x=>x.nombre);
  const o=readForm(f);for(const k in o){if(k.startsWith("e_"))a.empresa[k.slice(2)]=o[k]}
  a.iva=num(o.iva);a.validez=num(o.validez)||15;a.meta=num(o.meta);a.notaPresupuesto=o.notaPresupuesto;a.notaFactura=o.notaFactura;a.equipo=o.equipo.split(",").map(s=>s.trim()).filter(Boolean);
  await saveAj(a);render()}
function backup(){const all=[];KINDS.forEach(k=>D[k].forEach(x=>{const {id,...data}=x;all.push({id,kind:k,data})}));const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(all,null,1)],{type:"application/json"}));a.download=`lannex-gestion-${today()}.json`;a.click()}
async function restore(file){if(!file)return;if(!confirm("Se añadirán o sobrescribirán los datos con los del archivo. ¿Seguir?"))return;const rows=JSON.parse(await file.text());for(const r of rows){if(KINDS.includes(r.kind))await save(r.kind,{...r.data,id:r.id})}await loadAll();toast("Copia restaurada");renderNav();render()}

/* ---------------- arranque ---------------- */
if(!DEMO&&!sb){$("#l-err").textContent="No se pudo cargar la conexión. Recarga la página.";$("#l-err").style.display="block"}
start();
window.addEventListener("focus",async()=>{if(document.getElementById("app").style.display==="block"&&!$("#dr").classList.contains("open")){await loadAll();renderNav();render()}});
</script>
