<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Gestión · Lannex Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%231B1A21'/%3E%3Ctext x='32' y='43' font-family='Georgia' font-size='30' fill='%23F6F3EE' text-anchor='middle'%3ELx%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#1B1A21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lannex"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<style>
:root{--bg:#EEEDF1;--paper:#F8F7FA;--ink:#1B1A21;--muted:#66636F;--line:#D9D6DF;--amber:#B26A2C;--amber2:#E9D3BC;--sage:#4F7A62;--sage2:#D3DED6;--wine:#3B1F2B;--red:#A33A3A;--red2:#F2D9D6;--blue2:#DCE3F0;
--serif:"Cormorant Garamond",Georgia,serif;--sans:Manrope,system-ui,sans-serif;--mono:"DM Mono",ui-monospace,monospace}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;line-height:1.1}
a{color:var(--amber)}
.lb{font:500 .7rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login .card{width:min(380px,100%);background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:32px}
.logo{display:inline-grid;place-items:center;width:56px;height:56px;border:1.5px solid var(--ink);border-radius:8px;background:#FBF8F2;font:500 1.9rem var(--serif);position:relative}
.logo small{position:absolute;top:2px;left:5px;font:700 .6rem var(--mono)}
#login h1{font-size:2rem;margin:18px 0 4px}#login p{color:var(--muted);margin:0 0 20px}
/* layout */
#app{display:none}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--ink);color:#F6F3EE;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;overflow:auto}
.side .brand{display:flex;gap:12px;align-items:center;padding:0 8px}.side .brand .logo{width:42px;height:42px;font-size:1.4rem;color:var(--ink)}
.side .brand b{display:block;font:600 .9rem var(--sans);letter-spacing:.14em}.side .brand span{font:500 .65rem var(--mono);color:var(--amber2);letter-spacing:.14em}
.side nav{display:grid;gap:2px}
.side nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:10px;display:flex;gap:10px;align-items:center;font-size:.92rem;color:#D8D5DE}
.side nav button:hover{background:#2A2932}.side nav button.on{background:#F6F3EE;color:var(--ink);font-weight:600}
.side nav button .ct{margin-left:auto;font:500 .7rem var(--mono);background:var(--amber);color:#fff;border-radius:99px;padding:1px 7px}
.side .foot{margin-top:auto;font-size:.8rem;color:#A9A6B0;padding:0 8px}.side .foot button{all:unset;cursor:pointer;text-decoration:underline}
.top{display:none}
main{padding:28px clamp(16px,3vw,40px) 80px;min-width:0}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-size:2.4rem}.ph p{margin:4px 0 0;color:var(--muted)}
.demo{background:var(--amber2);border-radius:12px;padding:10px 14px;margin-bottom:18px;font-size:.88rem}
/* ui */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1.5px solid var(--ink);background:var(--ink);color:#fff;font-weight:600;font-size:.88rem;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.o{background:transparent;color:var(--ink)}.btn.s{padding:6px 12px;font-size:.8rem}.btn.r{background:var(--red);border-color:var(--red)}.btn.g{background:var(--sage);border-color:var(--sage)}
.btn.a{background:var(--amber);border-color:var(--amber)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi .v{font:500 2.1rem var(--serif);margin-top:4px}.kpi .s{font-size:.8rem;color:var(--muted)}
.card h2{font-size:1.5rem;margin-bottom:10px}
.list{display:grid;gap:8px}
.it{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.it:hover{border-color:var(--amber)}.it .m{flex:1;min-width:0}.it .m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.it .m span{font-size:.82rem;color:var(--muted)}
.date{width:46px;text-align:center;border-radius:10px;background:var(--ink);color:#fff;padding:4px 0;flex:none}.date b{display:block;font:500 1.3rem var(--serif);line-height:1}.date span{font:500 .6rem var(--mono);text-transform:uppercase}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.72rem;font-weight:600;background:var(--bg);white-space:nowrap}
.t-lead{background:var(--blue2)}.t-presupuesto{background:var(--amber2)}.t-confirmado{background:var(--sage2)}.t-realizado{background:#1B1A21;color:#fff}.t-perdido{background:var(--red2);color:var(--red)}
.t-pend{background:var(--red2);color:var(--red)}.t-ok{background:var(--sage2);color:#2F5A42}
.empty{color:var(--muted);font-size:.9rem;padding:8px 2px}
table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font:500 .68rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
tr.cl{cursor:pointer}tr.cl:hover td{background:#fff}
.tw{overflow-x:auto}
.num{text-align:right;font-variant-numeric:tabular-nums}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters input,.filters select{padding:8px 12px;border:1px solid var(--line);border-radius:99px;background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:.82rem;cursor:pointer}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* forms */
.f{display:grid;gap:12px}.f .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
label.fl{display:grid;gap:4px;font-size:.78rem;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea,input.in,select.in,textarea.in{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:.92rem;font-weight:400;color:var(--ink)}
.f textarea{min-height:70px;resize:vertical}
.ck{display:flex;gap:8px;align-items:center;font-size:.9rem;font-weight:500;color:var(--ink)}
.sec{font:500 .7rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
/* drawer */
#ov{position:fixed;inset:0;background:rgba(27,26,33,.45);display:none;z-index:40}
#dr{position:fixed;top:0;right:0;height:100%;width:min(680px,100%);background:var(--bg);z-index:50;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column}
#dr.open{transform:none}#ov.open{display:block}
#dr .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--paper)}
#dr .hd h2{font-size:1.7rem}#dr .bd{padding:18px 20px 40px;overflow:auto;flex:1}
.x{all:unset;cursor:pointer;font-size:1.6rem;line-height:1;padding:4px 8px}
.tot{display:grid;gap:4px;justify-content:end;text-align:right;font-variant-numeric:tabular-nums}.tot b{font:600 1.3rem var(--serif)}
.lines .ln{display:grid;grid-template-columns:minmax(0,1fr) 110px 70px 80px 30px;gap:6px;align-items:center;margin-bottom:6px}
.lines .ln input,.lines .ln select{padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
.lines .ln.cx{grid-template-columns:24px minmax(0,1fr) 110px 56px 74px 74px 24px}
.del{all:unset;cursor:pointer;color:var(--red);font-size:1.2rem;text-align:center}
.tl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.tl label{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px;font-size:.78rem;text-align:center;cursor:pointer}
.tl input{display:none}.tl label:has(input:checked){background:var(--amber2);border-color:var(--amber)}.tl label b{display:block;font:500 1.2rem var(--serif)}
.tl label.c:has(input:checked){background:var(--sage2);border-color:var(--sage)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font:500 .66rem var(--mono);text-transform:uppercase;color:var(--muted);text-align:center;padding:4px}
.cal .d{min-height:96px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px;font-size:.75rem}
.cal .d.out{opacity:.4}.cal .d.today{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.cal .d .n{font:600 .8rem var(--mono)}.cal .ev{display:block;margin-top:3px;border-radius:6px;padding:2px 5px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--amber)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:.88rem;transition:transform .2s;z-index:60}
#toast.show{transform:translateX(-50%)}
#print{display:none}
@media(max-width:900px){
 .layout{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;width:260px;z-index:45;transform:translateX(-100%);transition:transform .2s}.side.open{transform:none}
 .top{display:flex;position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;padding:10px 14px;align-items:center;justify-content:space-between}
 .top button{all:unset;cursor:pointer;font-size:1.4rem;padding:2px 6px}
 .g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2{grid-template-columns:1fr}
 .ph h1{font-size:2rem}.f .two,.f .three{grid-template-columns:1fr}
 .lines .ln{grid-template-columns:minmax(0,1fr) 90px 56px 70px 24px}
 .cal .d{min-height:64px;font-size:.66rem;padding:4px}.tl{grid-template-columns:repeat(3,minmax(0,1fr))}
 .hide-m{display:none}
 #calcgrid{grid-template-columns:1fr!important}#c-res{position:static!important}
 .lines .ln.cx{grid-template-columns:22px repeat(4,minmax(0,1fr)) 20px}.lines .ln.cx>:nth-child(2){grid-column:2/-1}.lines .ln.cx>:nth-child(3){grid-column:1/span 2}.lines .ln.cx{border-bottom:1px solid var(--line);padding-bottom:8px}
}
@media print{
 body.printing #app,body.printing #login,body.printing #dr,body.printing #ov,body.printing #toast{display:none!important}
 body.printing #print{display:block}body.printing{background:#fff}
 @page{size:A4;margin:16mm}
}
.doc{font:400 10.5pt/1.5 var(--sans);color:#1B1A21}
.doc .dh2{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #1B1A21;padding-bottom:14px;margin-bottom:18px}
.doc h1{font:500 28pt var(--serif)}.doc .meta{text-align:right;font-size:9.5pt}
.doc .who{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:18px;font-size:9.5pt}
.doc table th{color:#555}.doc .tt{margin-top:14px;margin-left:auto;width:260px}.doc .tt div{display:flex;justify-content:space-between;padding:3px 0}.doc .tt .g{border-top:2px solid #1B1A21;font-weight:700;font-size:12pt;padding-top:6px}
.doc .nt{margin-top:22px;font-size:9pt;color:#444;white-space:pre-wrap}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <span class="logo"><small>3</small>Lx</span>
    <h1>Gestión Lannex</h1>
    <p>Acceso privado del equipo</p>
    <form class="f" onsubmit="doLogin(event)">
      <label class="fl">Email<input type="email" id="l-email" autocomplete="username" required></label>
      <label class="fl">Contraseña<input type="password" id="l-pass" autocomplete="current-password" required></label>
      <p style="font-size:.8rem;color:var(--muted);margin:0">Solo tendrás que entrar una vez en cada dispositivo.</p>
      <button class="btn" type="submit" style="justify-content:center">Entrar</button>
      <p id="l-err" style="color:var(--red);font-size:.85rem;margin:0;display:none"></p>
    </form>
  </div>
</div>

<div id="app">
  <div class="top"><button onclick="toggleSide()" aria-label="Menú">☰</button><b style="letter-spacing:.14em">LANNEX LAB</b><button onclick="newTaller()" aria-label="Nuevo taller">＋</button></div>
  <div class="layout">
    <aside class="side" id="side">
      <div class="brand"><span class="logo"><small>3</small>Lx</span><div><b>LANNEX LAB</b><span>GESTIÓN</span></div></div>
      <nav id="nav"></nav>
      <div class="foot"><div id="who"></div><button onclick="logout()">Cerrar sesión</button></div>
    </aside>
    <main id="main"></main>
  </div>
</div>
<div id="ov" onclick="closeDr()"></div>
<div id="dr"><div class="hd"><h2 id="dr-t"></h2><button class="x" onclick="closeDr()" aria-label="Cerrar">×</button></div><div class="bd" id="dr-b"></div></div>
<div id="toast"></div>
<div id="print"></div>

<script>
(function(){
  var sb=window.supabase.createClient("https://yyuqwkgwxrgtsbeuiitg.supabase.co","sb_publishable_cKK1IFhMvBA3ss5oqqSUeg_tHe_SRAh",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:"lannex-gestion-auth"}});
  window.__sb=sb;
  function showLogin(){document.getElementById("login").style.display="grid";document.getElementById("app").style.display="none"}
  function showErr(m){var e=document.getElementById("l-err");e.textContent=m;e.style.display="block"}
  window.doLogin=async function(e){
    e.preventDefault();document.getElementById("l-err").style.display="none";
    var r=await sb.auth.signInWithPassword({email:document.getElementById("l-email").value.trim(),password:document.getElementById("l-pass").value});
    if(r.error){showErr("Email o contraseña incorrectos");return}
    loadApp();
  };
  async function loadApp(){
    var s=await sb.auth.getSession();
    if(!s.data.session){showLogin();return}
    var d=await sb.storage.from("gestion-private").download("app.js");
    if(d.error||!d.data){showLogin();showErr("No se ha podido cargar la gestión. Inténtalo de nuevo o revisa la configuración de Supabase.");return}
    var code=await d.data.text();
    var el=document.createElement("script");el.textContent=code;document.body.appendChild(el);
  }
  loadApp();
})();
</script>
</body>
</html>
